<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>GrowZone Prototype</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      position: fixed;
      top: 0;
      left: 0;
    }

    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      background: #181818;
      z-index: 1;
    }

    /* MENU */
    #menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top, #222, #050505);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
    }

    #menu h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    #menu p {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 25px;
    }

    #nameInput {
      padding: 10px 14px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
      outline: none;
      width: 220px;
      text-align: center;
      margin-bottom: 15px;
    }

    #nameInput::placeholder {
      color: #666;
    }

    #startBtn {
      padding: 12px 32px;
      font-size: 18px;
      background: #4caf50;
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(76,175,80,0.4);
    }

    #startBtn:active {
      transform: scale(0.96);
    }

    /* MOBILE CONTROLS */
    #mobileControls {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 40%;
      pointer-events: none;
      z-index: 10;
    }

    .joystick-base {
      position: absolute;
      left: 15%;
      bottom: 20%;
      width: 120px;
      height: 120px;
      margin-left: -60px;
      margin-bottom: -60px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      pointer-events: auto;
      touch-action: none;
    }

    .joystick-stick {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 60px;
      height: 60px;
      margin-left: -30px;
      margin-top: -30px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      touch-action: none;
    }

    #pcHint {
      position: fixed;
      top: 10px;
      left: 10px;
      font-size: 14px;
      opacity: 0.7;
      z-index: 20;
    }

    /* LEADERBOARD + ZONE TIMER */
    #leaderboard {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.5);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      max-width: 40vw;
      z-index: 20;
    }

    #leaderboard h3 {
      margin: 0 0 4px 0;
      font-size: 12px;
      text-align: right;
      opacity: 0.8;
    }

    #leaderboard ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    #leaderboard li {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 2px;
      white-space: nowrap;
    }

    #leaderboard .you {
      color: #4caf50;
      font-weight: bold;
    }

    #zoneTimer {
      margin-top: 4px;
      font-size: 11px;
      text-align: right;
      opacity: 0.9;
      color: #ff8080;
    }

    @media (max-width: 600px) {
      #leaderboard {
        font-size: 11px;
        padding: 4px 8px;
        max-width: 55vw;
      }
      #zoneTimer {
        font-size: 10px;
      }
    }

    /* ZONE WARNING TEXT */
    #zoneWarning {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      color: #ff5555;
      text-shadow: 0 0 10px rgba(0,0,0,0.8);
      font-weight: bold;
      z-index: 30;
      display: none;
      text-align: center;
    }

    @media (max-width: 600px) {
      #zoneWarning {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <canvas id="gameCanvas"></canvas>

  <!-- MENU -->
  <div id="menu">
    <h1>GrowZone</h1>
    <p>Grow when still. Shrink when moving. Outlast the chaos.</p>
    <input id="nameInput" maxlength="16" placeholder="Your name...">
    <button id="startBtn">Start</button>
  </div>

  <div id="pcHint">Move: WASD / Arrows. Stand still to grow.</div>

  <div id="mobileControls" style="display:none;">
    <div class="joystick-base" id="joystickBase">
      <div class="joystick-stick" id="joystickStick"></div>
    </div>
  </div>

  <div id="leaderboard">
    <h3>Leaderboard</h3>
    <ul id="leaderboardList"></ul>
    <div id="zoneTimer">Next shrink: --s</div>
  </div>

  <div id="zoneWarning">ZONE SHRINKING SOON</div>

  <script src="game.js"></script>
</body>
</html>
