<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>GrowZone Prototype</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #111;
      color: #fff;
      font-family: sans-serif;
    }

    #gameCanvas {
      display: block;
      background: #181818;
      position: relative;
      z-index: 1;
    }

    /* MENU */
    #menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #111;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
    }

    #menu h1 {
      font-size: 48px;
      margin-bottom: 30px;
    }

    #startBtn {
      padding: 15px 40px;
      font-size: 24px;
      background: #4caf50;
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
    }

    #startBtn:active {
      transform: scale(0.95);
    }

    /* MOBILE CONTROLS */
    #mobileControls {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 40%;
      pointer-events: none;
      z-index: 10;
    }

    .joystick-base {
      position: absolute;
      left: 15%;
      bottom: 20%;
      width: 120px;
      height: 120px;
      margin-left: -60px;
      margin-bottom: -60px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      pointer-events: auto;
      touch-action: none;
    }

    .joystick-stick {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 60px;
      height: 60px;
      margin-left: -30px;
      margin-top: -30px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      touch-action: none;
    }

    #pcHint {
      position: fixed;
      top: 10px;
      left: 10px;
      font-size: 14px;
      opacity: 0.7;
      z-index: 20;
    }
  </style>
</head>

<body>
  <canvas id="gameCanvas"></canvas>

  <!-- MENU -->
  <div id="menu">
    <h1>GrowZone</h1>
    <button id="startBtn">Start</button>
  </div>

  <div id="pcHint">Move: WASD / Arrows. Stand still to grow.</div>

  <div id="mobileControls" style="display:none;">
    <div class="joystick-base" id="joystickBase">
      <div class="joystick-stick" id="joystickStick"></div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
